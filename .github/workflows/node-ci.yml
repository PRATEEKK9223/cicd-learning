name: Node.js CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Node.js Application

    runs-on: ubuntu-latest

    steps:

      # Step 1: Download repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Execute automated tests
      - name: Run Tests
        run: npm test